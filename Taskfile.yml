version: "3"

tasks:
  default:
    desc: "利用可能な task を表示"
    cmds:
      - task --list

  collect:
    desc: "Rust CLI で記事を収集（DISCOVER=true、THROUGH=raw|translate|pr を指定可能）"
    requires:
      vars: [URL]
    env:
      ARTICLE_COLLECTOR_TASK_URL: "{{.URL}}"
      ARTICLE_COLLECTOR_TASK_DISCOVER: "{{.DISCOVER}}"
      ARTICLE_COLLECTOR_TASK_THROUGH: "{{.THROUGH}}"
    preconditions:
      - sh: command -v cargo
        msg: "cargo is required"
    cmds:
      - |
        set -- "$ARTICLE_COLLECTOR_TASK_URL"
        if [ "$ARTICLE_COLLECTOR_TASK_DISCOVER" = true ]; then
          set -- "$@" --discover
        fi
        if [ -n "$ARTICLE_COLLECTOR_TASK_THROUGH" ]; then
          set -- "$@" --through "$ARTICLE_COLLECTOR_TASK_THROUGH"
        fi
        cargo run --locked --bin article-collector -- article collect "$@"

  install:
    desc: "ローカル checkout から article-collector をインストール"
    cmds:
      - cargo install --path . --locked

  fmt:
    desc: "Rust formatting を検証"
    cmds:
      - cargo fmt --check

  clippy:
    desc: "Rust lint を実行"
    cmds:
      - cargo clippy --all-targets -- -D warnings

  toml-fmt:
    desc: "TOML formatting を検証"
    preconditions:
      - sh: command -v taplo
        msg: "taplo CLI is required"
    cmds:
      - taplo format --check Cargo.toml article-collector.toml .config/release-plz.toml

  toml-lint:
    desc: "TOML lint を実行"
    preconditions:
      - sh: command -v taplo
        msg: "taplo CLI is required"
    cmds:
      - taplo lint Cargo.toml article-collector.toml .config/release-plz.toml

  toml-check:
    desc: "TOML formatting と lint を検証"
    cmds:
      - task: toml-fmt
      - task: toml-lint

  test:
    desc: "Rust unit tests を実行"
    cmds:
      - cargo test --locked

  build:
    desc: "release build を検証"
    cmds:
      - cargo build --release --locked

  lint:
    desc: "Rust、TOML、検証スクリプトを lint"
    cmds:
      - task: fmt
      - task: clippy
      - task: toml-check
      - shellcheck install.sh tests/install.sh tests/generate-x-plugin-registry.sh scripts/*.sh
      - task: workflow-security

  workflow-security:
    desc: "GitHub Actions の release automation hardening を検証"
    cmds:
      - bash scripts/verify-workflow-security.sh

  plugin-registry:
    desc: "plugin registry schema と署名 fixture を検証"
    cmds:
      - bash tests/generate-x-plugin-registry.sh
      - bash scripts/verify-plugin-registry.sh

  check:
    desc: "CI 相当のローカル検証"
    cmds:
      - task: lint
      - task: plugin-registry
      - task: test
      - task: build

  verify-pr:
    desc: "PR チェックリストを自動検証"
    requires:
      vars: [PR_NUMBER]
    preconditions:
      - sh: command -v gh
        msg: "gh CLI is required"
    cmds:
      - bash scripts/verify-pr.sh {{.PR_NUMBER}}

  verify-local:
    desc: "PR なしで全ルールをローカル実行"
    cmds:
      - bash scripts/verify-pr.sh --local
