name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify workflow hardening
        run: bash scripts/verify-workflow-security.sh

  release-pr-scope:
    name: Release PR Scope
    if: startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/verify-release-pr-scope.sh "$PR_NUMBER"

  rust-check:
    name: Rust Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Verify release build
        run: cargo build --release --locked

  plugin-registry:
    name: Plugin Registry (PR-safe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Validate registry schema and signature fixtures
        run: |
          bash tests/generate-x-plugin-registry.sh
          bash scripts/verify-plugin-registry.sh

  toml-check:
    name: TOML Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install Taplo
        run: cargo install taplo-cli --version 0.10.0 --locked

      - name: Check TOML formatting
        run: taplo format --check Cargo.toml article-collector.toml .config/release-plz.toml

      - name: Run TOML lint
        run: taplo lint Cargo.toml article-collector.toml .config/release-plz.toml

  script-lint:
    name: Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck -x install.sh tests/install.sh tests/generate-x-plugin-registry.sh scripts/*.sh
