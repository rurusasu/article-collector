[package]
name = "article-collector"
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rurusasu/article-collector"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "form",
  "http2",
  "json",
  "rustls",
  "stream",
  "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
toml = "1.2"
regex = "1"
scraper = "0.29"
quick-xml = "0.42"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
anyhow = "1"
async-trait = "0.1"
command-group = { version = "5.0.1", features = ["with-tokio"] }
html-escape = "0.3"
dirs = "7"
slog = "2"
slog-term = "2"
slog-async = "2"
rmcp = { version = "3.11.0", default-features = false, features = [
  "client",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
] }
jsonschema = { version = "0.63.1", default-features = false }
ed25519-dalek = "3"
semver = { version = "1", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
url = { version = "2", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "3"
