[package]
name = "article-collector"
version = "0.6.17"
edition = "2021"
license = "MIT"
repository = "https://github.com/rurusasu/article-collector"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls-tls",
  "stream",
  "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
regex = "1"
scraper = "0.22"
quick-xml = "0.38"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
html-escape = "0.2"
dirs = "6"
slog = "2"
slog-term = "2"
slog-async = "2"
rmcp = { version = "2.2.0", default-features = false, features = [
  "client",
  "transport-async-rw",
] }
jsonschema = { version = "0.49.1", default-features = false }
ed25519-dalek = "3"
semver = { version = "1", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
url = { version = "2", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "3"
